[project]
name = "legal-golive-desk"
version = "1.0.0"
description = "Delivery engine for rolling out a legal AI workspace to EMEA law firms, measured on simulated rollouts."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44",
  "defusedxml>=0.7",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "playwright>=1.48"]

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PIE", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["golive"]

[[tool.mypy.overrides]]
module = ["defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
